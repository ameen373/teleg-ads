<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تطبيقي على تليجرام</title>
    <!-- مكتبة تليجرام الرسمية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
            direction: rtl;
        }

        /* Nav Dock */
        .nav-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .nav-item {
            color: var(--hint-color);
            border: none;
            background: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 20%;
        }

        .nav-item.active {
            color: var(--button-color);
            font-weight: bold;
        }

        /* Container & Cards */
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--button-color);
            margin-top: 4px;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--button-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--button-color);
            color: var(--button-text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--button-text);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Items Lists */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* Custom Toast */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="container">
        <!-- 1. المحفظة والإحصائيات -->
        <section id="wallet-tab" class="tab-content active">
            <div class="card">
                <p style="color: var(--hint-color); font-size: 13px;">الرصيد الحالي</p>
                <h1 id="balance-val" style="font-size: 32px; margin: 8px 0; color: var(--success-color);">$0.00</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--hint-color);">إجمالي الأرباح</div>
                    <div id="earned-val" class="stat-value">$0.00</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--hint-color);">إجمالي المصروفات</div>
                    <div id="spent-val" class="stat-value" style="color: var(--danger-color);">$0.00</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--hint-color);">الروابط</div>
                    <div id="links-count" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 12px; color: var(--hint-color);">الحملات</div>
                    <div id="campaigns-count" class="stat-value">0</div>
                </div>
            </div>
        </section>

        <!-- 2. الروابط المختصرة -->
        <section id="links-tab" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 12px;">اختصار رابط جديد</h3>
                <form id="link-form">
                    <div class="form-group">
                        <label>الرابط الأصلي</label>
                        <input type="url" id="original-url" placeholder="https://example.com" required>
                    </div>
                    <button type="submit" class="btn" id="link-btn">
                        <span>اختصار الرابط</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 12px;">روابطي</h3>
                <div id="links-list">جاري التحميل...</div>
            </div>
        </section>

        <!-- 3. الحملات الإعلانية -->
        <section id="campaigns-tab" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 12px;">إنشاء حملة إعلانية</h3>
                <form id="campaign-form">
                    <div class="form-group">
                        <label>عنوان الحملة</label>
                        <input type="text" id="camp-title" required>
                    </div>
                    <div class="form-group">
                        <label>الرابط المستهدف</label>
                        <input type="url" id="camp-url" required>
                    </div>
                    <div class="form-group">
                        <label>الميزانية (بالسنت)</label>
                        <input type="number" id="camp-budget" min="1" placeholder="مثال: 500 سنت = $5" required>
                    </div>
                    <div class="form-group">
                        <label>تكلفة النقرة (بالسنت)</label>
                        <input type="number" id="camp-cpc" min="1" placeholder="مثال: 5" required>
                    </div>
                    <button type="submit" class="btn" id="camp-btn">
                        <span>إطلاق الحملة</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 12px;">حملاتي النشطة</h3>
                <div id="campaigns-list">جاري التحميل...</div>
            </div>
        </section>

        <!-- 4. الإيداع والسحب -->
        <section id="finance-tab" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 12px;">إيداع رصيد</h3>
                <form id="deposit-form">
                    <div class="form-group">
                        <label>المبلغ بالسنتات ($1 = 100 سنت)</label>
                        <input type="number" id="deposit-amount" min="100" placeholder="1000" required>
                    </div>
                    <button type="submit" class="btn" id="deposit-btn">
                        <span>تأكيد الإيداع</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 12px;">سحب أرباح</h3>
                <form id="withdraw-form">
                    <div class="form-group">
                        <label>المبلغ بالسنتات</label>
                        <input type="number" id="withdraw-amount" min="100" placeholder="500" required>
                    </div>
                    <button type="submit" class="btn" style="background-color: var(--danger-color);" id="withdraw-btn">
                        <span>طلب السحب</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>
        </section>
    </div>

    <!-- الشريط السفلي للتنقل -->
    <nav class="nav-dock">
        <button class="nav-item active" onclick="switchTab('wallet-tab', this)">
            <span>المحفظة</span>
        </button>
        <button class="nav-item" onclick="switchTab('links-tab', this)">
            <span>الروابط</span>
        </button>
        <button class="nav-item" onclick="switchTab('campaigns-tab', this)">
            <span>الحملات</span>
        </button>
        <button class="nav-item" onclick="switchTab('finance-tab', this)">
            <span>المالية</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // إرسال طلبات الـ REST API لملف server.js
        async function apiRequest(endpoint, method = 'GET', body = null) {
            const headers = {
                'Content-Type': 'application/json',
                'x-telegram-init-data': tg?.initData || ''
            };

            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            try {
                const response = await fetch(endpoint, config);
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'حدث خطأ في الاتصال');
                return data;
            } catch (err) {
                showToast(err.message, true);
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return null;
            }
        }

        // إظهار التنبيهات
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = isError ? 'var(--danger-color)' : 'var(--success-color)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // التحكم بمؤشرات التحميل في الأزرار
        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const text = btn.querySelector('span');
            const spinner = btn.querySelector('.spinner');

            btn.disabled = isLoading;
            text.style.display = isLoading ? 'none' : 'inline';
            spinner.style.display = isLoading ? 'inline-block' : 'none';
        }

        // التنقل بين الشاشات
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

            // تحديث البيانات حسب الشاشة
            if (tabId === 'wallet-tab') loadStats();
            if (tabId === 'links-tab') loadLinks();
            if (tabId === 'campaigns-tab') loadCampaigns();
        }

        // 1. جلب الإحصائيات
        async function loadStats() {
            const res = await apiRequest('/api/stats');
            if (res && res.stats) {
                document.getElementById('balance-val').textContent = `$${(res.stats.balance / 100).toFixed(2)}`;
                document.getElementById('earned-val').textContent = `$${(res.stats.totalEarned / 100).toFixed(2)}`;
                document.getElementById('spent-val').textContent = `$${(res.stats.totalSpent / 100).toFixed(2)}`;
                document.getElementById('links-count').textContent = res.stats.totalLinks;
                document.getElementById('campaigns-count').textContent = res.stats.totalCampaigns;
            }
        }

        // 2. إدارة الروابط
        async function loadLinks() {
            const res = await apiRequest('/api/links');
            const container = document.getElementById('links-list');
            if (res && res.links) {
                if (res.links.length === 0) {
                    container.innerHTML = '<p style="color: var(--hint-color); font-size: 13px;">لا توجد روابط مضافة حتى الآن</p>';
                    return;
                }
                container.innerHTML = res.links.map(l => `
                    <div class="list-item">
                        <div>
                            <div style="font-weight: 600;">/${l.shortUrl}</div>
                            <div style="font-size: 11px; color: var(--hint-color);">${l.originalUrl}</div>
                        </div>
                        <span style="font-size: 12px; color: var(--button-color);">${l.clicksCount} نقرة</span>
                    </div>
                `).join('');
            }
        }

        document.getElementById('link-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('link-btn', true);
            const originalUrl = document.getElementById('original-url').value;

            const res = await apiRequest('/api/links', 'POST', { originalUrl });
            setLoading('link-btn', false);

            if (res && res.success) {
                showToast('تم اختصار الرابط بنجاح');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                document.getElementById('original-url').value = '';
                loadLinks();
            }
        });

        // 3. إدارة الحملات
        async function loadCampaigns() {
            const res = await apiRequest('/api/campaigns');
            const container = document.getElementById('campaigns-list');
            if (res && res.campaigns) {
                if (res.campaigns.length === 0) {
                    container.innerHTML = '<p style="color: var(--hint-color); font-size: 13px;">لا توجد حملات نشطة</p>';
                    return;
                }
                container.innerHTML = res.campaigns.map(c => `
                    <div class="list-item">
                        <div>
                            <div style="font-weight: 600;">${c.title}</div>
                            <div style="font-size: 11px; color: var(--hint-color);">المتبقي: ${c.remainingBudget} سنت</div>
                        </div>
                        <span style="font-size: 12px; color: var(--success-color);">${c.status}</span>
                    </div>
                `).join('');
            }
        }

        document.getElementById('campaign-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('camp-btn', true);

            const body = {
                title: document.getElementById('camp-title').value,
                targetUrl: document.getElementById('camp-url').value,
                budget: Number(document.getElementById('camp-budget').value),
                costPerClick: Number(document.getElementById('camp-cpc').value)
            };

            const res = await apiRequest('/api/campaigns', 'POST', body);
            setLoading('camp-btn', false);

            if (res && res.success) {
                showToast('تم إطلاق الحملة وخصم الميزانية');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                document.getElementById('campaign-form').reset();
                loadCampaigns();
            }
        });

        // 4. الإيداع والسحب
        document.getElementById('deposit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('deposit-btn', true);
            const amount = Number(document.getElementById('deposit-amount').value);

            const res = await apiRequest('/api/wallet/deposit', 'POST', { amount });
            setLoading('deposit-btn', false);

            if (res && res.success) {
                showToast('تم الإيداع بنجاح');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                document.getElementById('deposit-amount').value = '';
            }
        });

        document.getElementById('withdraw-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('withdraw-btn', true);
            const amount = Number(document.getElementById('withdraw-amount').value);

            const res = await apiRequest('/api/wallet/withdraw', 'POST', { amount });
            setLoading('withdraw-btn', false);

            if (res && res.success) {
                showToast('تم السحب بنجاح');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                document.getElementById('withdraw-amount').value = '';
            }
        });

        // التحميل الأولي
        loadStats();
    </script>
</body>
</html>
