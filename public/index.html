<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telega.ads - Telegram Ad Network</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app-loader" class="loader-overlay">
    <div class="pulse-ring"></div>
    <span class="loader-text">Telega.ads</span>
  </div>

  <div id="app-container" class="app-wrapper hidden">
    <!-- Header -->
    <header class="top-bar glass-panel">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Telega.ads</h1>
      </div>
      <div class="header-actions">
        <button id="btn-header-lang" class="icon-btn" aria-label="Language">
          <span id="current-flag">🇬🇧</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Content -->
    <main id="main-viewport" class="viewport">
      
      <!-- Section 1: My Account (حسابي) -->
      <section id="section-account" class="view-section active-view">
        <div class="profile-hero-card glass-panel animate-float">
          <div class="avatar-wrapper">
            <img id="user-avatar" src="" alt="Profile" class="avatar-img" />
            <span class="status-badge"></span>
          </div>
          <h2 id="user-display-name" class="user-name">User</h2>
          <p class="user-role-tag" data-i18n="account_verified">Verified Partner</p>
        </div>

        <div class="action-grid">
          <button class="feature-btn glass-panel ripple" data-action="open-language">
            <span class="btn-icon">🌐</span>
            <span class="btn-label" data-i18n="btn_language">Change Language</span>
            <span class="btn-arrow">›</span>
          </button>

          <button class="feature-btn glass-panel ripple" data-action="open-faq">
            <span class="btn-icon">❓</span>
            <span class="btn-label" data-i18n="btn_faq">FAQ</span>
            <span class="btn-arrow">›</span>
          </button>

          <button class="feature-btn glass-panel ripple" data-action="open-channel">
            <span class="btn-icon">📢</span>
            <span class="btn-label" data-i18n="btn_official_channel">Official Channel</span>
            <span class="btn-arrow">›</span>
          </button>

          <button class="feature-btn glass-panel ripple" data-action="open-support">
            <span class="btn-icon">🎧</span>
            <span class="btn-label" data-i18n="btn_support">Support Team</span>
            <span class="btn-arrow">›</span>
          </button>
        </div>
      </section>

      <!-- Section 2: My Channels (قنواتي) -->
      <section id="section-channels" class="view-section">
        <div class="section-header">
          <h2 data-i18n="nav_channels">My Channels</h2>
          <button class="primary-btn pulse-btn" data-action="toggle-add-channel" data-i18n="btn_add_channel">+ Add Channel</button>
        </div>
        <div id="add-channel-panel" class="collapsible-panel hidden glass-panel">
          <input type="text" id="channel-input" class="modern-input" data-i18n-placeholder="placeholder_channel" placeholder="@channel_username" />
          <button id="submit-channel-btn" class="primary-btn full-width" data-i18n="btn_verify_channel">Verify & Connect</button>
        </div>
        <div id="channels-list" class="cards-container"></div>
      </section>

      <!-- Section 3: Promotion (الترويج) -->
      <section id="section-campaigns" class="view-section">
        <div class="section-header">
          <h2 data-i18n="nav_promotion">Promotion</h2>
          <button class="primary-btn pulse-btn" data-action="toggle-create-campaign" data-i18n="btn_new_ad">+ New Ad</button>
        </div>
        <div id="create-campaign-panel" class="collapsible-panel hidden glass-panel">
          <input type="text" id="ad-title-input" class="modern-input" data-i18n-placeholder="placeholder_ad_title" placeholder="Campaign Title" />
          <textarea id="ad-content-input" class="modern-input" rows="3" data-i18n-placeholder="placeholder_ad_text" placeholder="Ad message text..."></textarea>
          <input type="number" id="ad-budget-input" class="modern-input" data-i18n-placeholder="placeholder_budget" placeholder="Budget (USDT)" />
          <button id="submit-campaign-btn" class="primary-btn full-width" data-i18n="btn_launch_ad">Launch Campaign</button>
        </div>
        <div id="campaigns-list" class="cards-container"></div>
      </section>

      <!-- Section 4: Referral (الإحالة) -->
      <section id="section-referral" class="view-section">
        <div class="section-header">
          <h2 data-i18n="nav_referral">Referral</h2>
        </div>
        <div class="glass-panel referral-box">
          <p class="referral-desc" data-i18n="referral_desc">Invite friends and earn commission from every campaign and payout.</p>
          <button class="primary-btn full-width ripple" data-action="reveal-referral" data-i18n="btn_get_ref_link">Generate Invite Link</button>
          <div id="referral-link-box" class="hidden ref-result">
            <input type="text" id="ref-link-input" class="modern-input" readonly />
            <button id="copy-ref-btn" class="secondary-btn full-width" data-i18n="btn_copy">Copy Link</button>
          </div>
        </div>
      </section>

      <!-- Section 5: Admin Only (قسم الإدارة - مخفي تماماً عن الجميع إلا المالك) -->
      <section id="section-admin" class="view-section hidden-admin">
        <div class="section-header">
          <h2 data-i18n="nav_admin">Admin Control</h2>
          <span class="admin-badge">OWNER</span>
        </div>
        <div class="action-grid">
          <button class="feature-btn glass-panel ripple" data-action="admin-stats">
            <span class="btn-icon">📊</span>
            <span class="btn-label" data-i18n="admin_live_stats">Live Platform Stats</span>
            <span class="btn-arrow">›</span>
          </button>
          <button class="feature-btn glass-panel ripple" data-action="admin-broadcast">
            <span class="btn-icon">📣</span>
            <span class="btn-label" data-i18n="admin_broadcast">Global Broadcast</span>
            <span class="btn-arrow">›</span>
          </button>
          <button class="feature-btn glass-panel ripple" data-action="admin-security">
            <span class="btn-icon">🛡️</span>
            <span class="btn-label" data-i18n="admin_shield">Anti-Bot & Security Logs</span>
            <span class="btn-arrow">›</span>
          </button>
        </div>
        <div id="admin-dynamic-workspace" class="collapsible-panel hidden glass-panel"></div>
      </section>

    </main>

    <!-- Floating Pill Bottom Navigation Bar (تصميم تيليجرام العائم المطور) -->
    <div class="bottom-nav-wrapper">
      <nav id="bottom-nav" class="bottom-nav">
        <!-- الكبسولة النشطة المنزلقة -->
        <div id="nav-active-pill" class="nav-active-pill"></div>

        <!-- 1. حسابي (مع صورة الملف الشخصي الحقيقية) -->
        <button class="nav-item active" data-target="section-account">
          <div class="nav-icon-wrap">
            <img id="nav-user-avatar" src="" alt="Profile" class="nav-avatar-img" />
          </div>
          <span class="nav-text" data-i18n="nav_account">Account</span>
        </button>

        <!-- 2. قنواتي -->
        <button class="nav-item" data-target="section-channels">
          <div class="nav-icon-wrap">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
              <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
              <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
              <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
              <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"></path>
            </svg>
            <span id="badge-channels" class="nav-badge hidden">0</span>
          </div>
          <span class="nav-text" data-i18n="nav_channels">Channels</span>
        </button>

        <!-- 3. الترويج -->
        <button class="nav-item" data-target="section-campaigns">
          <div class="nav-icon-wrap">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span id="badge-campaigns" class="nav-badge hidden">0</span>
          </div>
          <span class="nav-text" data-i18n="nav_promotion">Promotion</span>
        </button>

        <!-- 4. الإحالة -->
        <button class="nav-item" data-target="section-referral">
          <div class="nav-icon-wrap">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
            </svg>
          </div>
          <span class="nav-text" data-i18n="nav_referral">Referral</span>
        </button>

        <!-- 5. الإدارة (مخفي إلا للمالك) -->
        <button id="nav-admin-btn" class="nav-item hidden-admin" data-target="section-admin">
          <div class="nav-icon-wrap">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span id="badge-admin" class="nav-badge hidden">0</span>
          </div>
          <span class="nav-text" data-i18n="nav_admin">Admin</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Interactive Modal Overlay -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-sheet glass-panel">
      <div class="modal-header">
        <h3 id="modal-title">Title</h3>
        <button id="modal-close-btn" class="close-btn">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
