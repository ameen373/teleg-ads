<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telega.ads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- الشريط العلوي -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-title">Telega.ads</span>
      </div>
      <div class="top-actions">
        <button id="btn-notifications" class="icon-btn" type="button" aria-label="Notifications">
          🔔 <span id="notif-badge" class="badge hidden">0</span>
        </button>
        <select id="lang-switcher" class="lang-select" aria-label="Language"></select>
      </div>
    </header>

    <!-- حاوية الأقسام الرئيسية -->
    <main class="main-content">
      <!-- قسم قنواتي -->
      <section id="section-channels" class="page-section active">
        <div class="action-grid">
          <button id="btn-open-add-channel" class="primary-btn" type="button" data-i18n="addChannelBtn">
            ➕ إضافة قناة جديدة
          </button>
          <button id="btn-toggle-my-channels" class="secondary-btn" type="button" data-i18n="myChannelsListBtn">
            📺 قنواتي المسجلة
          </button>
        </div>

        <!-- يظهر فقط عند الضغط على زر إضافة قناة جديدة -->
        <div id="add-channel-panel" class="collapsible-panel hidden">
          <div class="card">
            <h3 class="card-title" data-i18n="addChannelTitle">إضافة قناة جديدة</h3>

            <div class="form-group">
              <a id="bot-admin-link" href="https://t.me/adTelega_bot" target="_blank" rel="noopener noreferrer" class="bot-link-btn">
                🤖 إضافة البوت @adTelega_bot كمسؤول
              </a>
              <p class="hint-text" data-i18n="publicChannelOnlyHint">
                يتم قبول القنوات العامة فقط، ويتعرف البوت تلقائياً على من أضافه كمسؤول.
              </p>
            </div>

            <div class="form-group">
              <label for="channel-select-detected" data-i18n="selectDetectedChannel">اختر القناة التي تمت إضافة البوت إليها</label>
              <div class="row-gap">
                <select id="channel-select-detected" class="input-field"></select>
                <button id="btn-refresh-detected" class="ghost-btn" type="button" data-i18n="refreshBtn">تحديث</button>
              </div>
            </div>

            <div class="form-group">
              <label for="channel-cpm-price" data-i18n="channelPriceLabel">تحديد سعر القناة لكل 1000 مشاهدة (1$ - 3$)</label>
              <input id="channel-cpm-price" type="number" class="input-field" min="1" max="3" step="0.1" value="1" />
            </div>

            <div class="form-group">
              <label for="channel-language" data-i18n="channelLanguageLabel">لغة القناة</label>
              <select id="channel-language" class="input-field"></select>
            </div>

            <div class="form-group">
              <label for="channel-category" data-i18n="channelCategoryLabel">تصنيف القناة</label>
              <select id="channel-category" class="input-field"></select>
            </div>

            <button id="btn-submit-channel-config" class="primary-btn full-width" type="button" data-i18n="saveChannelBtn">
              حفظ وإرسال للتحقق
            </button>
          </div>
        </div>

        <!-- يظهر فقط عند الضغط على زر قنواتي المسجلة -->
        <div id="my-channels-panel" class="collapsible-panel hidden">
          <div id="my-channels-list" class="cards-stack"></div>
        </div>
      </section>

      <!-- قسم الترويج -->
      <section id="section-promotion" class="page-section hidden">
        <div class="action-grid">
          <button id="btn-open-create-campaign" class="primary-btn" type="button" data-i18n="createCampaignBtn">
            🚀 إنشاء حملة جديدة
          </button>
          <button id="btn-open-my-campaigns" class="secondary-btn" type="button" data-i18n="myCampaignsBtn">
            📊 الحملات الإعلانية
          </button>
          <button id="btn-open-verified-channels" class="secondary-btn" type="button" data-i18n="verifiedChannelsBtn">
            ✅ القنوات المعتمدة
          </button>
          <button id="btn-open-publish-logs" class="ghost-btn" type="button" data-i18n="publishLogsBtn">
            📜 سجل عمليات النشر
          </button>
        </div>

        <!-- يظهر فقط عند الضغط على زر إنشاء حملة جديدة -->
        <div id="create-campaign-panel" class="collapsible-panel hidden">
          <div class="card">
            <h3 class="card-title" data-i18n="createCampaignTitle">إنشاء حملة إعلانية جديدة</h3>

            <div class="form-group">
              <label for="campaign-title" data-i18n="campaignTitleLabel">عنوان الحملة</label>
              <input id="campaign-title" type="text" class="input-field" />
            </div>

            <div class="form-group">
              <label for="campaign-text" data-i18n="campaignTextLabel">نص المنشور الإعلاني</label>
              <textarea id="campaign-text" rows="4" class="input-field"></textarea>
            </div>

            <div class="form-group">
              <label for="campaign-media-file" data-i18n="campaignMediaLabel">إضافة صورة أو فيديو من المعرض</label>
              <input id="campaign-media-file" type="file" accept="image/*,video/*" class="input-field" />
              <div id="campaign-media-status" class="hint-text"></div>
            </div>

            <div class="form-group">
              <label for="campaign-budget" data-i18n="campaignBudgetLabel">ميزانية الحملة ($)</label>
              <input id="campaign-budget" type="number" class="input-field" min="1" step="0.01" />
            </div>

            <div class="form-group">
              <label class="checkbox-row">
                <input id="campaign-open-targeting" type="checkbox" />
                <span data-i18n="openTargetingLabel">🌍 الاستهداف المفتوح (بث في جميع القنوات إذا كانت الميزانية أكبر من 1000$)</span>
              </label>
            </div>

            <div id="standard-targeting-box">
              <div class="form-row">
                <div class="form-group half">
                  <label for="target-min-price" data-i18n="minPriceLabel">أقل سعر ($)</label>
                  <input id="target-min-price" type="number" class="input-field" min="1" max="3" step="0.1" value="1" />
                </div>
                <div class="form-group half">
                  <label for="target-max-price" data-i18n="maxPriceLabel">أعلى سعر ($)</label>
                  <input id="target-max-price" type="number" class="input-field" min="1" max="3" step="0.1" value="3" />
                </div>
              </div>

              <div class="form-group">
                <label for="target-language" data-i18n="targetLanguageLabel">استهداف حسب اللغة</label>
                <select id="target-language" class="input-field"></select>
              </div>

              <div class="form-group">
                <label for="target-category" data-i18n="targetCategoryLabel">استهداف حسب التصنيف</label>
                <select id="target-category" class="input-field"></select>
              </div>
            </div>

            <div class="form-group">
              <label for="campaign-btn-preset" data-i18n="interactiveButtonLabel">الأزرار التفاعلية</label>
              <select id="campaign-btn-preset" class="input-field">
                <option value="Open">Open</option>
                <option value="View Offer">View Offer</option>
                <option value="Join Channel">Join Channel</option>
                <option value="custom" data-i18n="customButtonOption">زر تفاعلي مخصص</option>
              </select>
              <input id="campaign-btn-custom" type="text" class="input-field mt-8 hidden" placeholder="نص الزر المخصص" />
              <input id="campaign-btn-url" type="url" class="input-field mt-8" placeholder="https://..." />
            </div>

            <div class="form-group">
              <label for="campaign-schedule" data-i18n="scheduleLabel">توقيت النشر</label>
              <select id="campaign-schedule" class="input-field">
                <option value="immediate" data-i18n="publishImmediate">نشر فوري</option>
                <option value="peak_hours" data-i18n="publishPeakHours">جدولة لأوقات الذروة</option>
              </select>
            </div>

            <!-- معاينة حية للإعلان مع ذيل Telega.ads الإجباري -->
            <div class="form-group">
              <label data-i18n="livePreviewLabel">معاينة حية لشكل الإعلان</label>
              <div id="campaign-live-preview" class="ad-preview-box"></div>
            </div>

            <div class="action-grid">
              <button id="btn-launch-campaign" class="primary-btn" type="button" data-i18n="launchCampaignBtn">
                إطلاق الحملة
              </button>
              <button id="btn-save-draft" class="secondary-btn" type="button" data-i18n="saveDraftBtn">
                حفظ كمسودة
              </button>
            </div>
          </div>
        </div>

        <!-- يظهر فقط عند الضغط على زر الحملات الإعلانية -->
        <div id="my-campaigns-panel" class="collapsible-panel hidden">
          <div id="my-campaigns-list" class="cards-stack"></div>
        </div>

        <!-- يظهر فقط عند الضغط على زر القنوات المعتمدة -->
        <div id="verified-channels-panel" class="collapsible-panel hidden">
          <div class="card">
            <div class="form-group">
              <input id="search-verified-channels" type="text" class="input-field" placeholder="ابحث عن قناة بالاسم..." />
            </div>
            <div class="row-gap mb-12">
              <button id="btn-filter-all-channels" class="chip-btn active" type="button">الكل</button>
              <button id="btn-filter-fav-channels" class="chip-btn" type="button">⭐ المفضلة</button>
            </div>
            <div id="verified-channels-list" class="cards-stack"></div>
          </div>
        </div>

        <!-- يظهر فقط عند الضغط على زر سجل عمليات النشر -->
        <div id="publish-logs-panel" class="collapsible-panel hidden">
          <div id="publish-logs-list" class="cards-stack"></div>
        </div>
      </section>

      <!-- قسم المحفظة -->
      <section id="section-wallet" class="page-section hidden">
        <div id="wallet-container" class="cards-stack"></div>
      </section>

      <!-- قسم الإدارة (للمالك فقط) -->
      <section id="section-admin" class="page-section hidden">
        <div id="admin-container" class="cards-stack"></div>
      </section>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-target="section-channels" type="button">
        <span>📺</span>
        <small data-i18n="navMyChannels">قنواتي</small>
      </button>
      <button class="nav-btn" data-target="section-promotion" type="button">
        <span>📣</span>
        <small data-i18n="navPromotion">الترويج</small>
      </button>
      <button class="nav-btn" data-target="section-wallet" type="button">
        <span>💼</span>
        <small data-i18n="navWallet">المحفظة</small>
      </button>
      <button id="nav-btn-admin" class="nav-btn hidden" data-target="section-admin" type="button">
        <span>🛡️</span>
        <small data-i18n="navAdmin">الإدارة</small>
      </button>
    </nav>

    <!-- نافذة الإشعارات المنبثقة -->
    <div id="notifications-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 data-i18n="notificationsTitle">الإشعارات</h3>
          <button id="btn-close-notifications" class="ghost-btn" type="button">✕</button>
        </div>
        <div id="notifications-list" class="cards-stack"></div>
      </div>
    </div>

    <!-- شريط التنبيهات -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
