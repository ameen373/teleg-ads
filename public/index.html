<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telega.ads — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="rtl">
  <div id="toast-banner" class="toast-banner is-hidden" role="status" aria-live="polite"></div>

  <div id="app" class="app-shell">
    <!-- الشريط العلوي -->
    <header class="top-bar">
      <div id="header-title" class="header-title">حسابي</div>
      <button id="lang-toggle-btn" class="lang-btn" type="button">EN</button>
    </header>

    <!-- حاوية الأقسام -->
    <main id="main-content" class="main-content app-main">
      <div id="view-account" class="app-view"></div>
      <div id="view-admin" class="app-view is-hidden"></div>
      <div id="view-placeholder" class="app-view is-hidden"></div>

      <section id="section-home" class="tab-section active" data-tab="home"></section>
      <section id="section-channels" class="tab-section" data-tab="channels"></section>
      <section id="section-campaigns" class="tab-section" data-tab="campaigns"></section>
      <section id="section-wallet" class="tab-section" data-tab="wallet"></section>
      <section id="section-referral" class="tab-section" data-tab="referral"></section>
      <section id="section-admin" class="tab-section" data-tab="admin"></section>
    </main>

    <!-- شريط التنقل السفلي العائم -->
    <nav class="bottom-nav-wrap bottom-nav" aria-label="Bottom Navigation">
      <button class="nav-item active is-active" data-target="home" data-nav-tab="account" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/>
          </svg>
          <span class="nav-badge" data-badge="home"></span>
        </span>
        <span class="nav-label" data-i18n="nav_home">حسابي</span>
      </button>

      <button class="nav-item" data-target="channels" data-nav-tab="channels" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <path d="M16.6 7.8L6.5 11.7c-.7.3-.7.7-.1.9l2.6.8 6-3.8c.3-.2.5-.1.3.1l-4.8 4.4-.2 2.7c.3 0 .4-.1.6-.3l1.4-1.4 2.9 2.1c.5.3.9.1 1-.5l1.8-8.6c.2-.7-.3-1-.9-.7z" fill="var(--pill-bg)"/>
          </svg>
          <span class="nav-badge" data-badge="channels"></span>
        </span>
        <span class="nav-label" data-i18n="nav_channels">قنواتي</span>
      </button>

      <button class="nav-item" data-target="campaigns" data-nav-tab="campaigns" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 4v16l-8-4H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h5l8-4zm2 4h2v2h-2V8zm0 6h2v2h-2v-2z"/>
          </svg>
          <span class="nav-badge" data-badge="campaigns"></span>
        </span>
        <span class="nav-label" data-i18n="nav_campaigns">الترويج</span>
      </button>

      <button class="nav-item" data-target="wallet" data-nav-tab="wallet" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2h-4a2 2 0 0 1 0-4h4V7a2 2 0 0 0-2-2zm-2 7a1 1 0 1 0 0 2h4v-2h-4z"/>
          </svg>
          <span class="nav-badge" data-badge="wallet"></span>
        </span>
        <span class="nav-label" data-i18n="nav_wallet">المحفظة</span>
      </button>

      <button class="nav-item" data-target="referral" type="button">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 14c-3.3 0-6 1.8-6 4v1h12v-1c0-2.2-2.7-4-6-4zm7 1c-1.2 0-2.3.3-3.2.8.8.8 1.2 1.9 1.2 3.2v1h7v-1c0-1.9-2.2-4-5-4z"/>
          </svg>
          <span class="nav-badge" data-badge="referral"></span>
        </span>
        <span class="nav-label" data-i18n="nav_referral">الإحالة</span>
      </button>

      <button class="nav-item is-hidden" data-target="admin" data-nav-tab="admin" type="button" style="display: none;">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66h-6V4.18zm0 15.63c-3.09-.98-5.33-4.38-5.88-8.16H12v8.16z"/>
          </svg>
          <span class="nav-badge" data-badge="admin"></span>
        </span>
        <span class="nav-label" data-i18n="nav_admin">الإدارة</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
