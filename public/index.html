<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telega-Ads</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="loader" class="loader-overlay">
    <div class="tg-spinner"></div>
  </div>

  <header class="tg-header">
    <div class="header-user">
      <div class="avatar" id="user-avatar">U</div>
      <div class="user-meta">
        <span class="user-name" id="user-name">User</span>
        <span class="user-sub" id="user-handle">@--- • ID: ---</span>
      </div>
    </div>
    <button id="lang-toggle-btn" class="lang-pill" type="button">AR / EN</button>
  </header>

  <main id="app-content" class="app-container">
    <!-- HOME SECTION -->
    <section id="view-home" class="view-section active"></section>

    <!-- CHANNELS SECTION -->
    <section id="view-channels" class="view-section"></section>

    <!-- PROMOTION (CAMPAIGNS) SECTION -->
    <section id="view-campaigns" class="view-section"></section>

    <!-- WALLET SECTION -->
    <section id="view-wallet" class="view-section"></section>

    <!-- REFERRAL SECTION -->
    <section id="view-referral" class="view-section"></section>

    <!-- ADMIN SECTION (HIDDEN BY DEFAULT - SHOWN ONLY FOR VERIFIED ADMIN) -->
    <section id="view-admin" class="view-section" style="display: none;"></section>
  </main>

  <!-- FLOATING GLASS PILL NAVIGATION BAR -->
  <div class="bottom-nav-wrapper">
    <nav class="tg-bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-target="view-home" type="button">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 3.19l7 6.11V20h-4v-6H9v6H5V9.3l7-6.11M12 1L2 9.73V22h8v-6h4v6h8V9.73L12 1z"/></svg>
        </div>
        <span class="nav-label" data-i18n="nav_home">Home</span>
      </button>

      <button class="nav-item" data-target="view-channels" type="button">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.96-.75 3.78-1.65 6.31-2.74 7.58-3.27 3.61-1.51 4.35-1.77 4.84-1.78.11 0 .35.03.5.16.13.1.17.24.18.34.02.07.02.21 0 .33z"/></svg>
          <span class="nav-badge" id="nav-badge-channels" style="display: none;">0</span>
        </div>
        <span class="nav-label" data-i18n="nav_channels">Channels</span>
      </button>

      <button class="nav-item" data-target="view-campaigns" type="button">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></svg>
          <span class="nav-badge" id="nav-badge-campaigns" style="display: none;">0</span>
        </div>
        <span class="nav-label" data-i18n="nav_promote">Promote</span>
      </button>

      <button class="nav-item" data-target="view-wallet" type="button">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </div>
        <span class="nav-label" data-i18n="nav_wallet">Wallet</span>
      </button>

      <button class="nav-item" data-target="view-referral" type="button">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
        <span class="nav-label" data-i18n="nav_referral">Referral</span>
      </button>

      <!-- ADMIN TAB HIDDEN COMPLETELY UNLESS USER IS VERIFIED ADMIN -->
      <button class="nav-item" id="nav-admin-btn" data-target="view-admin" type="button" style="display: none;">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        </div>
        <span class="nav-label" data-i18n="nav_admin">Admin</span>
      </button>
    </nav>
  </div>

  <script src="/js/language/ar.js"></script>
  <script src="/js/language/en.js"></script>
  <script src="/js/language/i18n.js"></script>
  <script src="/js/modules/api.js"></script>
  <script src="/js/modules/ui.js"></script>
  <script src="/js/modules/channels.js"></script>
  <script src="/js/modules/campaigns.js"></script>
  <script src="/js/modules/wallet.js"></script>
  <script src="/js/modules/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
