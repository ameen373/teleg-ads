<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telega.ads - Admin Control Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
    <div class="header">
        <h2>لوحة التحكم الخاصة بالفريق الإداري 🔒</h2>
        <button onclick="location.href='/'" class="btn">العودة للتطبيق</button>
    </div>

    <div class="stats-grid">
        <div class="card"><h4>إجمالي المستخدمين</h4><h2 id="totalUsers">0</h2></div>
        <div class="card"><h4>إجمالي المعلق</h4><h2 id="totalPending">$0.00</h2></div>
        <div class="card"><h4>طلبات الإيداع</h4><h2 id="pendingDeposits">0</h2></div>
        <div class="card"><h4>طلبات السحب</h4><h2 id="pendingWithdraws">0</h2></div>
    </div>

    <div class="card">
        <h3>توزيع الإيرادات الكلية على الروابط النشطة</h3>
        <input type="number" id="totalRevInput" placeholder="أدخل مبلغ الإيرادات الكلي ($)">
        <button id="distributeBtn" class="btn">توزيع الأرباح الآن</button>
    </div>

    <div class="card">
        <h3>مراجعة طلبات الإيداع</h3>
        <div id="depositsList"></div>
    </div>

    <div class="card">
        <h3>مراجعة طلبات السحب</h3>
        <div id="withdrawsList"></div>
    </div>

    <div class="card">
        <h3>إدارة المستخدمين والحظر</h3>
        <div id="usersList"></div>
    </div>

    <script src="/admin/admin.js"></script>
</body>
</html>
