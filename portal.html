<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telega-IO Extreme v3</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --card: rgba(30, 41, 59, 0.5);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 100px 15px;
            direction: rtl;
        }

        /* الهيدر */
        .app-header { text-align: center; margin-bottom: 25px; }
        .app-header img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent-blue); }

        /* الأقسام */
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* القائمة السفلية */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 500px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            padding: 12px 5px; border-radius: 25px; border: 1px solid var(--glass-border); z-index: 1000;
        }

        .nav-item { color: var(--text-dim); text-align: center; flex: 1; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-blue); }

        /* الملف الشخصي */
        .profile-header-premium { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .user-avatar-premium { width: 70px; height: 70px; border-radius: 20px; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--accent-blue); width: 0%; transition: 0.5s; }
        
        .stats-grid-premium { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { background: var(--glass-bg); padding: 15px; border-radius: 18px; text-align: center; }
        
        .btn { background: var(--accent-blue); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }

   /* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* الخط العام */
body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #0e1621;
    color: #fff;
}

/* الحاوية */
.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

/* العنوان */
.header {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* القائمة */
.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* عنصر القائمة */
.menu-item {
    background: #17212b;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid transparent;
}

/* تأثير hover */
.menu-item:hover {
    background: #1f2c3a;
    border-color: #2a3b4d;
    transform: translateY(-2px);
}

/* الجهة اليسرى (أيقونة + نص) */
.menu-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* الأيقونة */
.menu-icon {
    font-size: 20px;
    width: 36px;
    height: 36px;
    background: #2a3b4d;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* النص */
.menu-text {
    font-size: 15px;
}

/* السهم */
.menu-arrow {
    font-size: 14px;
    color: #8899a6;
}

/* قسم المحفظة (تمييز خاص) */
.wallet-item {
    background: linear-gradient(135deg, #1d2b3a, #243447);
    border: 1px solid #2f4b63;
}

.wallet-item:hover {
    background: linear-gradient(135deg, #243447, #2f4b63);
}

/* قسم العروض */
.offers-item {
    background: linear-gradient(135deg, #2b1f3a, #3a294d);
    border: 1px solid #4a3b63;
}

.offers-item:hover {
    background: linear-gradient(135deg, #3a294d, #4a3b63);
}

/* زر إشعار صغير (اختياري) */
.badge {
    background: #2a9df4;
    color: white;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 8px;
}

/* Responsive */
@media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    .menu-item {
        padding: 14px;
    }
}
        
    </style>
</head>
<body>

    <div class="app-header">
        <img id="app-logo" src="" alt="Logo">
    </div>

<div id="home" class="section active">
    
    <div class="card" style="display: flex; justify-content: space-around; padding: 10px; background: var(--glass-bg);">
        <div class="menu-item-quick" onclick="toggleSubPage('offersPage')" style="cursor: pointer; text-align: center;">
            <span style="font-size: 20px; display: block;">🎟️</span>
            <span style="font-size: 12px; color: var(--text-dim);">العروض</span>
        </div>
        <div class="menu-item-quick" onclick="toggleSubPage('walletPage')" style="cursor: pointer; text-align: center;">
            <span style="font-size: 20px; display: block;">💰</span>
            <span style="font-size: 12px; color: var(--text-dim);">المحفظة</span>
        </div>
    </div>

    <div id="offersPage" class="sub-page" style="display: none;">
        <div class="card">
            <h3 style="margin-top: 0;"><i class="fas fa-ticket-alt"></i> العروض المتاحة</h3>
            <div id="offers-container">
                <p style="text-align: center; color: var(--text-dim); font-size: 13px;">لا توجد عروض نشطة حالياً</p>
            </div>
        </div>
    </div>

    <div id="walletPage" class="sub-page">
        <div class="card" style="text-align: center; background: linear-gradient(145deg, rgba(59, 130, 246, 0.1), rgba(15, 23, 42, 0.8));">
            <small style="color: var(--text-dim);">الرصيد الحالي</small>
            <h2 id="current-balance" style="font-size: 2rem; margin: 10px 0;">$0.00</h2>
            
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex: 1; font-size: 12px;">إيداع</button>
                <button class="btn" style="flex: 1; font-size: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);">سحب</button>
                <button class="btn" style="flex: 1; font-size: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);">تحويل</button>
            </div>
        </div>

        <div class="card">
            <h4 style="margin-top: 0; font-size: 14px;"><i class="fas fa-history"></i> سجل العمليات</h4>
            <div id="transactions-list">
                <p style="text-align: center; color: var(--text-dim); font-size: 12px;">لا توجد عمليات سابقة</p>
            </div>
        </div>
    </div>

</div>
        

    <div id="promo" class="section">
        

    <div id="publisher" class="section">
        

    <div id="referrals" class="section">
        <div class="card">
            <h3>نظام الإحالة</h3>
            <p id="ref-link">جاري توليد الرابط...</p>
        </div>
    </div>

    <div id="profile" class="section">
        
        

    <div id="admin" class="section">
        

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showSection('home', this)"><i class="fas fa-home"></i><span>الرئيسية</span></div>
        <div class="nav-item" onclick="showSection('promo', this)"><i class="fas fa-ad"></i><span>المعلن</span></div>
        <div class="nav-item" onclick="showSection('publisher', this)"><i class="fas fa-bullhorn"></i><span>الناشر</span></div>
        <div class="nav-item" onclick="showSection('referrals', this)"><i class="fas fa-users"></i><span>الإحالة</span></div>
        <div class="nav-item" onclick="showSection('profile', this)"><i class="fas fa-user-circle"></i><span>الملف</span></div>
        <div class="nav-item" id="admin-nav" style="display: none;" onclick="showSection('admin', this)"><i class="fas fa-user-cog"></i><span>الإدارة</span></div>
    </div>

    <script>

// 1. الإعدادات الأساسية (لا تحذفها)
const webApp = window.Telegram.WebApp;
const ADMIN_ID = 549686235; // معرف أمين
const LOGO_URL = "https://i.ibb.co/Z6qzV2Wk/1777032600480logo.png";

const firebaseConfig = {
    apiKey: "AIzaSyB9wJ3RKL9Sc0VqIgOz3HIL6PAZMK1GZos",
    authDomain: "telega-io.firebaseapp.com",
    databaseURL: "https://telega-io-default-rtdb.firebaseio.com",
    projectId: "telega-io",
    storageBucket: "telega-io.firebasestorage.app",
    messagingSenderId: "413242252888",
    appId: "1:413242252888:web:6055aaa7fcdd256910b42d"
};

// تشغيل Firebase
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. دالة التشغيل عند تحميل الصفحة
function initApp() {
    webApp.ready();
    webApp.expand();
    document.getElementById('app-logo').src = LOGO_URL;

    const user = webApp.initDataUnsafe.user;
    if (user) {
        // تحديث اسم المستخدم ورابط الإحالة
        if(document.getElementById('user-name')) document.getElementById('user-name').innerText = user.first_name;
        if(document.getElementById('ref-link')) document.getElementById('ref-link').innerText = `https://t.me/YourBot?start=${user.id}`;
        
        // إظهار لوحة الإدارة إذا كان المستخدم هو أمين
        if (user.id === ADMIN_ID) {
            const adminNav = document.getElementById('admin-nav');
            if(adminNav) adminNav.style.display = 'block';
        }
    }
}

// 3. التنقل بين الأقسام الرئيسية (الرئيسية، المعلن، إلخ)
function showSection(sectionId, element) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    element.classList.add('active');

    if (webApp.HapticFeedback) webApp.HapticFeedback.impactOccurred('light');
}

// 4. التنقل بين الصفحات الفرعية (المحفظة والعروض) داخل القسم الرئيسي
function toggleSubPage(pageId) {
    document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none');
    const targetPage = document.getElementById(pageId);
    if (targetPage) {
        targetPage.style.display = 'block';
        if (webApp.HapticFeedback) webApp.HapticFeedback.impactOccurred('medium');
    }
}

window.onload = initApp;

        
    </script>
</body>
</html>
