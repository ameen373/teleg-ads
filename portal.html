<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telega-IO Extreme v3</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0e14;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 100px 15px;
            direction: rtl;
        }

        /* تنسيق اللوجو */
        .app-header { text-align: center; margin-bottom: 25px; }
        .app-header img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent-blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* القائمة السفلية العائمة */
        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .nav-item { color: var(--text-dim); text-align: center; flex: 1; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item.active i { transform: translateY(-5px); text-shadow: 0 0 10px var(--accent-blue); }

        .btn { background: var(--accent-blue); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="app-header">
        <img id="app-logo" src="" alt="Logo">
    </div>

    <div id="home" class="section active">
        <div class="card">
            <h2><i class="fas fa-wallet"></i> الرئيسية</h2>
            <p id="balance-display">رصيدك: 0.00 TRX</p>
        </div>
    </div>

    <div id="promo" class="section">
        <div class="card">
            <h2><i class="fas fa-rocket"></i> المعلن</h2>
            <p>أنشئ حملاتك الإعلانية هنا.</p>
            <button class="btn">إضافة إعلان جديد</button>
        </div>
    </div>

    <div id="publisher" class="section">
        <div class="card">
            <h2><i class="fas fa-layer-group"></i> الناشر</h2>
            <p>أضف قنواتك وابدأ بالربح.</p>
            <button class="btn" style="background: #10b981;">ربط قناة تليجرام</button>
        </div>
    </div>

    <div id="referrals" class="section">
        <div class="card">
            <h2><i class="fas fa-user-plus"></i> الإحالة</h2>
            <p>رابط الإحالة الخاص بك:</p>
            <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:10px; word-break:break-all;" id="ref-link">جاري التحميل...</div>
        </div>
    </div>

    <div id="admin" class="section">
        <div class="card" style="border-color: #ef4444;">
            <h2 style="color: #ef4444;"><i class="fas fa-user-shield"></i> لوحة الإدارة</h2>
            <p>مرحباً بك يا أمين. التحكم الكامل متاح الآن.</p>
            <button class="btn" style="background: #475569;">إدارة القنوات المنتظرة</button>
            <button class="btn" style="background: #475569;">طلبات السحب</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showSection('home', this)"><i class="fas fa-home"></i><span>الرئيسية</span></div>
        <div class="nav-item" onclick="showSection('promo', this)"><i class="fas fa-ad"></i><span>المعلن</span></div>
        <div class="nav-item" onclick="showSection('publisher', this)"><i class="fas fa-bullhorn"></i><span>الناشر</span></div>
        <div class="nav-item" onclick="showSection('referrals', this)"><i class="fas fa-users"></i><span>الإحالة</span></div>
        <div class="nav-item" id="admin-nav" style="display: none;" onclick="showSection('admin', this)"><i class="fas fa-user-cog"></i><span>الإدارة</span></div>
    </div>

    <script>
        // الإعدادات التي قدمتها
        const webApp = window.Telegram.WebApp;
        const ADMIN_ID = 549686235;
        const LOGO_URL = "https://i.ibb.co/Z6qzV2Wk/1777032600480logo.png";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB9wJ3RKL9Sc0VqIgOz3HIL6PAZMK1GZos",
            authDomain: "telega-io.firebaseapp.com",
            databaseURL: "https://telega-io-default-rtdb.firebaseio.com",
            projectId: "telega-io",
            storageBucket: "telega-io.firebasestorage.app",
            messagingSenderId: "413242252888",
            appId: "1:413242252888:web:6055aaa7fcdd256910b42d"
        };

        // تشغيل Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function initApp() {
            webApp.ready();
            webApp.expand();
            document.getElementById('app-logo').src = LOGO_URL;

            const user = webApp.initDataUnsafe.user;
            if (user) {
                // التحقق من الإدارة
                if (user.id === ADMIN_ID) {
                    document.getElementById('admin-nav').style.display = 'block';
                }
                // تحديث رابط الإحالة
                document.getElementById('ref-link').innerText = `https://t.me/YourBot?start=${user.id}`;
            }
        }

        function showSection(sectionId, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            element.classList.add('active');

            if (webApp.HapticFeedback) webApp.HapticFeedback.impactOccurred('light');
        }

        window.onload = initApp;
    </script>
</body>
</html>
